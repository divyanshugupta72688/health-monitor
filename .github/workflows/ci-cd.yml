name: CI-CD
on:
  push:
    branches: [main]
jobs:
  build-test-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t health-monitor .

      - name: Smoke test
        run: |
          docker run -d --name hm -p 3000:3000 health-monitor
          sleep 5
          curl -f http://localhost:3000/health

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push image
        run: |
          docker tag health-monitor ${{ secrets.DOCKERHUB_USERNAME }}/health-monitor:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/health-monitor:latest